<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WHMIS at Sunrise Ridge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0475AC;--primary-dk:#035580;--teal:#0E9DBD;--teal-lt:#E2F6FB;
  --amber:#D97706;--amber-lt:#FEF3C7;--green:#16A34A;--green-lt:#DCFCE7;
  --red:#DC2626;--red-lt:#FEE2E2;--ink:#16203A;--muted:#5A6276;
  --line:#E7EBF1;--r:18px;--r-sm:12px;--ease:cubic-bezier(.4,0,.2,1);--body:'Inter',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:#fff}

/* TOP */
#top{padding:14px 18px 10px;flex-shrink:0}
#toprow{display:flex;align-items:center;gap:10px;margin-bottom:11px}
#clock{display:inline-flex;align-items:center;gap:7px;background:#F3F7FA;border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--primary)}
#clock .d{width:7px;height:7px;border-radius:50%;background:var(--teal)}
#sec-label{font-size:13px;font-weight:700;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu-btn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
#menu-btn:active{transform:scale(.94)}
#ticks{display:flex;gap:5px}
#ticks .t{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
#ticks .t i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--primary));border-radius:3px;transition:width .5s var(--ease)}

/* STAGE */
#stage{flex:1;position:relative;overflow-y:auto;overflow-x:hidden;padding:10px 18px 22px}
#stage::-webkit-scrollbar{display:none}
.card{animation:cardIn .45s var(--ease) both}
.card.out{animation:cardOut .22s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-16px)}}

/* NAV */
#nav{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
#back{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s,opacity .2s}
#back:active{transform:scale(.9)}
#back.hide{visibility:hidden;opacity:0}
#tapcue{flex:1;text-align:center;font-size:13px;font-weight:600;color:#AAB3C0;letter-spacing:.02em;opacity:0;transition:opacity .3s}
#tapcue.show{opacity:1;animation:cuePulse 1.8s ease-in-out infinite}
@keyframes cuePulse{0%,100%{opacity:.5}50%{opacity:.95}}
#fwd{margin-left:auto;height:52px;min-width:52px;border:none;border-radius:26px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;padding:0 24px;font-size:16px;font-weight:700;transition:transform .12s,background .25s,padding .25s;box-shadow:0 6px 18px rgba(4,117,172,.28)}
#fwd.icon{padding:0;width:52px;min-width:52px}
#fwd.locked{background:#CBD3DC;box-shadow:none;pointer-events:none}
#fwd:active{transform:scale(.93)}
#fwd .chev{display:flex}
#fwd:not(.locked) .chev{animation:nudge 1.5s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}

/* GENERIC */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
.beat{padding:14px 0}
.beat p{font-size:20px;line-height:1.72;color:var(--ink);font-weight:400}
.beat p+p{margin-top:15px}
.beat strong{color:var(--primary);font-weight:700}
.beat em{font-style:normal;color:#3C4459;display:block;font-size:18px;line-height:1.7;background:#F7F9FB;border-left:3px solid var(--teal);padding:14px 16px;border-radius:0 12px 12px 0}
.scene-img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--r);display:block;margin-bottom:18px;background:#EEF2F6}

/* COVER */
.cover .eyebrow{color:var(--teal)}
.cover h2{font-size:31px;font-weight:800;color:var(--primary);line-height:1.16;margin-bottom:14px}
.cover p{font-size:19px;line-height:1.72;color:var(--muted)}

/* OPENER */
.opener .kick{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-bottom:12px}
.opener h2{font-size:25px;font-weight:800;color:var(--ink);line-height:1.3;margin-bottom:14px}
.opener .scn{font-size:19px;line-height:1.65;color:var(--ink);margin-bottom:20px}
.op-choice{display:flex;flex-direction:column;gap:12px}
.op-btn{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:17px 18px;font-size:17px;font-weight:600;line-height:1.45;color:var(--ink);display:flex;gap:13px;align-items:center;transition:transform .14s,border-color .2s,background .2s}
.op-btn .ei{font-size:22px}
.op-btn:active{transform:scale(.98)}
.op-btn.pick{border-color:var(--primary);background:#EFF8FC}
.op-reveal{margin-top:18px;font-size:18px;line-height:1.68;color:var(--ink);display:none}
.op-reveal.show{display:block;animation:cardIn .45s both}
.op-reveal .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:8px}

/* SECTION DIVIDER */
.sectioncard{position:relative;overflow:hidden;min-height:160px;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;border-radius:var(--r);background:linear-gradient(90deg,var(--teal),var(--primary-dk))}
.sectioncard .sc-text{position:relative;z-index:1;max-width:55%}
.sectioncard .num{font-size:50px;font-weight:800;color:rgba(255,255,255,.32);line-height:1}
.sectioncard h2{font-size:26px;font-weight:800;color:#fff;line-height:1.2;margin-top:6px}
.sectioncard .sc-icon{position:absolute;top:0;bottom:0;right:0;width:45%;height:100%;object-fit:contain;display:block}
.sc-meta{padding:0 4px;margin-top:13px}
.sc-meta .nm{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.sc-meta .t{font-size:15px;color:var(--muted);margin-top:4px;font-weight:600}

/* PULL QUOTE (no bubble) */
.quote{padding:16px 2px 18px}
.quote .qm{font-family:Georgia,serif;font-size:54px;color:var(--teal);line-height:.1;height:22px;display:block}
.quote .qt{font-size:22px;line-height:1.5;font-weight:600;color:var(--ink);margin:14px 0 16px}
.quote .by{display:flex;align-items:center;gap:11px}
.quote .by .nm{font-size:14px;font-weight:700;color:var(--primary)}
.quote .by .rl{font-size:13px;color:var(--muted)}
.av{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}

/* LEARN (no label) */
.learn{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.learn .hd{background:var(--primary);color:#fff;padding:16px 18px}
.learn .hd h3{font-size:20px;font-weight:700;line-height:1.3}
.learn .bd{padding:17px 18px}
.learn .bd>p{font-size:18px;line-height:1.7;color:var(--ink)}
.learn ul{list-style:none;margin:13px 0 0}
.learn li{display:flex;gap:11px;font-size:17px;line-height:1.6;color:var(--ink);padding:8px 0}
.learn li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal);margin-top:10px;flex-shrink:0}
.learn .hl{margin-top:15px;background:var(--teal-lt);border-radius:11px;padding:13px 15px;font-size:17px;font-weight:600;color:var(--primary-dk);line-height:1.55}

/* FLIP PLAN */
.flip{perspective:1400px;margin:8px 0;height:372px}
.flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s var(--ease)}
.flip.open .flip-in{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
.flip-front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.flip-front .pic{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:34px;overflow:hidden;margin-bottom:14px}
.flip-front .pic img{width:100%;height:100%;object-fit:cover}
.flip-front .fname{font-size:23px;font-weight:800;color:var(--ink)}
.flip-front .ftags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0 18px}
.flip-front .pill{font-size:12px;font-weight:700;background:#EEF2F6;color:var(--muted);padding:4px 11px;border-radius:20px}
.flip-front .prompt{display:inline-flex;align-items:center;gap:8px;color:var(--primary);font-size:14px;font-weight:700;background:var(--teal-lt);padding:9px 16px;border-radius:999px}
.flip-front .prompt svg{animation:spin 3.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flip-back{transform:rotateY(180deg);display:flex;flex-direction:column}
.flip-back .bh{background:var(--primary);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.flip-back .bh .bn{font-size:16px;font-weight:700}
.flip-back .bh .bf{font-size:12px;font-weight:600;opacity:.85;display:flex;align-items:center;gap:5px}
.flip-back .bb{padding:6px 16px 16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.flip-back .bb::-webkit-scrollbar{width:0}
.prow{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow .pi{width:18px;flex-shrink:0;display:flex;justify-content:center;padding-top:3px}
.prow .pl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.prow .pt{font-size:15px;line-height:1.5;color:var(--ink)}
.cg{color:var(--green)}.cr{color:var(--red)}.ca{color:var(--amber)}.cb{color:var(--primary)}
.palert{margin-top:11px;background:var(--red-lt);color:#991B1B;border-radius:10px;padding:11px 13px;font-size:14px;font-weight:600;line-height:1.5}

/* ACTIVITY SHELL */
.act{border:1.5px solid var(--line);border-radius:var(--r);padding:18px}
.act .tag{display:inline-flex;align-items:center;gap:6px;background:var(--amber);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:5px 13px;border-radius:20px;margin-bottom:13px}
.act h3{font-size:19px;font-weight:700;color:var(--primary);margin-bottom:7px}
.act .q{font-size:18px;line-height:1.6;color:var(--ink);margin-bottom:15px;font-weight:500}

/* ORDER */
.oitem{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;transition:border-color .2s}
.oitem .ot{flex:1;font-size:15.5px;font-weight:500;line-height:1.45}
.oitem .obtns{display:flex;flex-direction:column;gap:4px}
.oitem .ob{width:32px;height:28px;border:1px solid var(--line);background:#F3F7FA;border-radius:7px;font-size:13px;color:var(--primary)}
.oitem.ok{border-color:var(--green);background:var(--green-lt)}
.oitem.no{border-color:var(--amber)}

/* CHOICES */
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:9px;transition:border-color .2s,background .2s}
.opt .lt{width:27px;height:27px;border-radius:7px;background:#F3F7FA;color:var(--primary);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt .ox{font-size:16px;line-height:1.5;color:var(--ink)}
.opt.sel{border-color:var(--primary);background:#EFF8FC}.opt.sel .lt{background:var(--primary);color:#fff}
.opt.ok{border-color:var(--green);background:var(--green-lt)}.opt.ok .lt{background:var(--green);color:#fff}
.opt.bad{border-color:var(--red);background:var(--red-lt)}.opt.bad .lt{background:var(--red);color:#fff}
.opt.dis{opacity:.55;pointer-events:none}
.subbtn{width:100%;border:none;border-radius:11px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:var(--primary);margin-top:4px;transition:opacity .2s}
.subbtn:disabled{background:#CBD3DC}

/* FEEDBACK */
.fb{margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);display:none}
.fb.show{display:block;animation:cardIn .4s var(--ease) both}
.fb .fh{padding:11px 14px;font-size:14px;font-weight:700;color:#fff;display:flex;align-items:center;gap:7px}
.fb.good .fh{background:var(--green)}.fb.bad .fh{background:var(--amber)}.fb.wrong .fh{background:var(--red)}
.sw-end{border:1.5px solid var(--green);background:var(--green-lt);border-radius:16px;padding:20px 18px;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;display:none}
.sw-end.low{border-color:var(--amber);background:var(--amber-lt)}
.sw-end.low .ring{background:var(--amber)}
.sw-end.low .score{color:#92400E}
.sw-end.low .scoresub{color:var(--amber)}
.sw-end.low .ft{border-top-color:rgba(146,64,14,.18)}
.sw-stage .sw-end{position:relative}
.sw-end.show{display:block;opacity:1;transform:none}
.sw-end .ring{width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;margin:0 auto 12px}
.sw-end .score{text-align:center;font-size:22px;font-weight:800;color:#14653A}
.sw-end .scoresub{text-align:center;font-size:13px;font-weight:700;color:var(--green);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.sw-end .ft{font-size:15.5px;line-height:1.6;color:var(--ink);margin-top:14px;padding-top:14px;border-top:1px solid rgba(20,101,58,.18)}
.fb .fbody{padding:14px;background:#fff}
.fb .ft{font-size:15.5px;line-height:1.6;color:var(--ink)}.fb .ft+.ft{margin-top:8px}
.linda{display:flex;gap:11px;align-items:flex-start;margin-top:10px;background:#F3F7FA;border-radius:12px;padding:12px}
.linda .who{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:3px}
.linda .lx{font-size:15px;line-height:1.6;color:var(--ink)}

/* TRUE FALSE */
.tf-pb{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:8px}
.tf-pf{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--primary));transition:width .4s var(--ease)}
.tf-ct{font-size:13px;font-weight:600;color:var(--muted);text-align:center;margin-bottom:12px}
.tf-card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:22px 16px;min-height:124px;display:flex;align-items:center;justify-content:center;text-align:center}
.tf-txt{font-size:19px;font-weight:600;line-height:1.5;color:var(--ink)}
.tf-btns{display:flex;gap:10px;margin-top:12px}
.tf-btn{flex:1;border:1.5px solid;border-radius:12px;padding:15px;font-size:16px;font-weight:700;background:#fff;display:flex;align-items:center;justify-content:center;gap:7px}
.tf-t{color:var(--green);border-color:var(--green)}.tf-f{color:var(--red);border-color:var(--red)}
.tf-fb{margin-top:12px;border-radius:12px;padding:13px 14px;font-size:15px;line-height:1.6;display:none}
.tf-fb.show{display:block;animation:cardIn .35s both}
.tf-fb.good{background:var(--green-lt);color:#14532D}.tf-fb.bad{background:var(--amber-lt);color:#7C2D12}
.tf-nx{margin-top:10px;width:100%;border:none;background:var(--primary);color:#fff;border-radius:11px;padding:13px;font-weight:700;font-size:15px;display:none}
.tf-nx.show{display:block}

/* CONFIRM CHECKLIST */
.ck{display:flex;align-items:center;gap:13px;border:1.5px solid var(--line);border-radius:13px;padding:15px;margin-bottom:10px;transition:border-color .2s,background .2s}
.ck .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;transition:background .2s,border-color .2s}
.ck .ckt{font-size:16px;font-weight:500;line-height:1.45;color:var(--ink)}
.ck.on{border-color:var(--green);background:var(--green-lt)}
.ck.on .box{background:var(--green);border-color:var(--green)}
.ck-done{margin-top:6px;font-size:15px;font-weight:600;color:var(--green);display:none}
.ck-done.show{display:block;animation:cardIn .35s both}

/* DECISION */
.dc-opts{display:flex;gap:10px;flex-wrap:wrap}
.dc-btn{flex:1;min-width:140px;border:1.5px solid;border-radius:12px;padding:16px;font-size:15px;font-weight:700;background:#fff}
.dc-y{color:var(--green);border-color:var(--green)}.dc-n{color:var(--red);border-color:var(--red)}
.dc-btn.sel-y{background:var(--green-lt)}.dc-btn.sel-n{background:var(--red-lt)}
.revbtn{margin-top:14px;width:100%;border:1.5px solid var(--primary);background:#fff;color:var(--primary);border-radius:11px;padding:13px;font-weight:700;font-size:15px}
.finbox{margin-top:12px;background:var(--green-lt);border-radius:12px;padding:14px;font-size:15px;line-height:1.6;color:#14532D;display:none}
.finbox.show{display:block;animation:cardIn .35s both}

/* TAP REVEAL */
.tr{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:9px;transition:border-color .2s}
.tr.open{border-color:var(--teal)}
.tr .th{display:flex;align-items:center;gap:12px;padding:15px;cursor:pointer}
.tr .tn{width:30px;height:30px;border-radius:8px;background:var(--teal-lt);color:var(--primary);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tr .ttl{flex:1;font-size:16px;font-weight:600;color:var(--ink)}
.tr .tchev{color:var(--muted);transition:transform .3s}.tr.open .tchev{transform:rotate(180deg)}
.tr .tb{max-height:0;overflow:hidden;transition:max-height .35s var(--ease)}.tr.open .tb{max-height:260px}
.tr .tb-in{padding:0 15px 15px}
.tr .rf{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--amber);margin-bottom:2px}
.tr .rv{font-size:15px;line-height:1.55;color:var(--ink);margin-bottom:10px}
.tr .df{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--green);margin-bottom:2px}

/* HOLD */
.hold{text-align:center;padding:8px 0 4px}
.hold .hi{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:7px}
.hold .hs{font-size:16px;color:var(--muted);line-height:1.6;margin-bottom:20px}
.holdbtn{position:relative;width:148px;height:148px;border-radius:50%;border:none;background:transparent;margin:0 auto;display:block;touch-action:none}
.holdbtn svg{position:absolute;inset:0;transform:rotate(-90deg)}
.holdbtn .tk{fill:none;stroke:var(--line);stroke-width:8}
.holdbtn .pr{fill:none;stroke:var(--teal);stroke-width:8;stroke-linecap:round;stroke-dasharray:427;stroke-dashoffset:427;transition:stroke-dashoffset .08s linear}
.holdbtn .fc{position:absolute;inset:17px;border-radius:50%;background:#F3F7FA;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:background .2s}
.holdbtn.on .fc{background:var(--teal-lt)}
.holdbtn.done .fc{background:var(--green-lt);border-color:var(--green)}
.holdbtn .ic{font-size:32px}.holdbtn .lb{font-size:13px;font-weight:700;color:var(--muted)}
.hold .hl2{min-height:22px;margin-top:15px;font-size:16px;font-weight:600;color:var(--ink)}

/* RECAP */
.recap-item{display:flex;gap:13px;align-items:flex-start;border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:9px;opacity:0;transform:translateY(12px);transition:opacity .4s,transform .4s}
.recap-item.in{opacity:1;transform:translateY(0)}
.recap-item .rn{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.recap-item p{font-size:16px;line-height:1.6;color:var(--ink)}

/* COMPLETE */
.done-wrap{text-align:center;padding:38px 6px}
.done-ring{width:90px;height:90px;border-radius:50%;background:var(--green-lt);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:var(--green);font-size:44px;animation:pop .5s var(--ease) both}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.done-wrap h2{font-size:29px;font-weight:800;color:var(--primary);line-height:1.2;margin-bottom:12px}
.done-wrap p{font-size:18px;line-height:1.7;color:var(--muted);max-width:350px;margin:0 auto 24px}
.replay{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:13px 24px;font-weight:700;font-size:15px}

/* CONFETTI */
#confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.cf{position:absolute;width:8px;height:8px;border-radius:2px;animation:fall 1.1s ease-out forwards}
@keyframes fall{to{transform:translateY(380px) rotate(360deg);opacity:0}}

/* SIDE DRAWER */
#drawer{position:absolute;inset:0;z-index:80;background:rgba(15,22,40,.45);opacity:0;pointer-events:none;transition:opacity .25s}
#drawer.open{opacity:1;pointer-events:auto}
#drawer-card{position:absolute;top:0;right:0;bottom:0;width:80%;max-width:310px;background:#fff;transform:translateX(100%);transition:transform .32s var(--ease);padding:0 0 env(safe-area-inset-bottom);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
#drawer.open #drawer-card{transform:translateX(0)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 12px;border-bottom:1px solid var(--line)}
.dh span{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.dh button{width:34px;height:34px;border:none;background:#F3F7FA;border-radius:50%;font-size:20px;color:var(--ink);display:flex;align-items:center;justify-content:center}
#drawer-list{padding:8px 12px;overflow-y:auto}
.sl{display:flex;align-items:center;gap:13px;padding:14px 8px;border-radius:11px;cursor:pointer}
.sl:active{background:#F3F7FA}
.sl .sd{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);flex-shrink:0}
.sl.done .sd{background:var(--primary);border-color:var(--primary);color:#fff}
.sl.cur .sd{border-color:var(--primary);color:var(--primary)}
.sl .sn{font-size:16px;font-weight:600;color:var(--ink)}
.sl.cur .sn{color:var(--primary);font-weight:700}

/* ===== ROUND 3 ===== */
.opt .ox{font-size:17px;line-height:1.55}
.linda .lx{font-size:16px;line-height:1.62}
.prow .pt{font-size:15.5px;line-height:1.55}
.prow .pl{font-size:12px}
.act .q{font-size:18px}
.learn li>div{flex:1;min-width:0}

/* cover hero button centered */
.cover-cta{display:flex;justify-content:center;margin:28px 0 6px}
.cover-cta button{border:none;border-radius:30px;background:var(--primary);color:#fff;font-size:17px;font-weight:700;padding:16px 30px;display:inline-flex;align-items:center;gap:10px;box-shadow:0 8px 22px rgba(4,117,172,.32)}
.cover-cta button:active{transform:scale(.96)}

/* plan flip front with big image */
.flip{height:580px}
.flip-front{padding:0;align-items:stretch;justify-content:flex-end}
.flip-front .pfimg{position:absolute;inset:0}
.flip-front .pfimg img{width:100%;height:100%;object-fit:cover}
.flip-front .pf-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:64px;font-weight:800}
.flip-front .pfshade{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,15,30,.85) 0%,rgba(8,15,30,.22) 48%,rgba(8,15,30,0) 74%)}
.flip-front .pfinfo{position:relative;z-index:2;padding:22px 20px;text-align:left;width:100%}
.flip-front .fname{font-size:25px;font-weight:800;color:#fff}
.flip-front .ftags{justify-content:flex-start;margin:10px 0 14px}
.flip-front .ftags .pill{background:rgba(255,255,255,.22);color:#fff}
.flip-front .prompt{background:#fff;color:var(--primary)}

/* image + speech callout */
.callout{position:relative;border-radius:18px;overflow:hidden;margin:10px 0;background:#0b1220}
.callout .coimg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.callout .coshade{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,15,30,.82) 0%,rgba(8,15,30,.12) 55%,rgba(8,15,30,0) 82%)}
.callout .cobubble{position:absolute;left:14px;right:14px;bottom:16px;background:#fff;border-radius:16px;padding:16px 17px;box-shadow:0 10px 28px rgba(0,0,0,.32)}
.callout .cobubble::after{content:"";position:absolute;left:28px;top:-8px;width:17px;height:17px;background:#fff;transform:rotate(45deg);border-radius:3px}
.callout .cot{font-size:19px;line-height:1.5;font-weight:600;color:var(--ink);position:relative;z-index:1}
.callout .coby{display:flex;align-items:center;gap:9px;margin-top:12px;position:relative;z-index:1}
.callout .coby .nm{font-size:13.5px;font-weight:700;color:var(--primary)}
.callout .coby .rl{font-size:12.5px;color:var(--muted)}
.callout.focus .cobubble{background:var(--ink)}
.callout.focus .cobubble::after{background:var(--ink)}
.callout.focus .cot{color:#fff;font-size:22px;font-weight:700;line-height:1.45}
.callout.focus .coby .nm{color:#7CD4E6}
.callout.focus .coby .rl{color:#AEB6C6}
.co-kick{position:absolute;top:14px;left:14px;z-index:3;background:var(--amber);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:20px}
.co-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;overflow:hidden;flex-shrink:0}
.co-av img{width:100%;height:100%;object-fit:cover}

/* hotspot find the hazards */
.hs-wrap{position:relative;border-radius:16px;overflow:hidden;margin:8px 0;background:#0b1220}
.hs-wrap img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.hs-wrap .hs-veil{position:absolute;inset:0;background:rgba(8,15,30,.14)}
.spot{position:absolute;width:40px;height:40px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;background:rgba(4,117,172,.6);color:#fff;font-size:23px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.45);animation:spulse 1.8s ease-in-out infinite;z-index:2}
@keyframes spulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.spot.found{background:var(--green);border-color:#fff;animation:none}
.hs-tip{position:absolute;transform:translate(-50%,-118%);background:#fff;color:var(--ink);font-size:13px;font-weight:600;line-height:1.4;padding:9px 11px;border-radius:11px;box-shadow:0 6px 18px rgba(0,0,0,.35);width:180px;z-index:6;display:none}
.hs-tip.show{display:block;animation:cardIn .3s both}
.hs-count{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--primary);margin:13px 0 2px}
.hs-count .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.hs-count .dot.on{background:var(--green)}
.hs-done{margin-top:10px;font-size:15px;line-height:1.6;color:#14532D;background:var(--green-lt);border-radius:12px;padding:13px 14px;display:none}
.hs-done.show{display:block;animation:cardIn .35s both}
.hs-modal{position:absolute;inset:0;z-index:8;background:rgba(8,15,30,.7);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .25s}
.hs-modal.show{opacity:1;pointer-events:auto}
.hs-modal-card{background:#fff;border-radius:14px;padding:20px 16px 16px;max-width:280px;position:relative;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:pop .3s var(--ease) both}
.hs-modal-card .hx{position:absolute;top:8px;right:8px;width:28px;height:28px;border:none;background:#F3F7FA;border-radius:50%;font-size:18px;color:var(--ink);line-height:1}
.hs-modal-card .htx{font-size:15px;line-height:1.55;color:var(--ink);font-weight:600;padding-right:14px}

/* bio popup */
#bio{position:absolute;inset:0;z-index:90;background:rgba(15,22,40,.55);opacity:0;pointer-events:none;transition:opacity .25s;display:flex;align-items:center;justify-content:center;padding:22px}
#bio.open{opacity:1;pointer-events:auto}
#bio-card{width:100%;max-width:380px;max-height:80%;background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transform:scale(.94);transition:transform .25s var(--ease);box-shadow:0 20px 50px rgba(0,0,0,.4)}
#bio.open #bio-card{transform:scale(1)}
#bio-head{background:var(--primary);color:#fff;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#bio-head .bt{font-size:17px;font-weight:700}
#bio-head button{width:32px;height:32px;border:none;background:rgba(255,255,255,.22);border-radius:50%;color:#fff;font-size:20px}
#bio-body{padding:4px 16px 16px;overflow-y:auto}
.biobtn{width:100%;border:1.5px solid var(--primary);background:#fff;color:var(--primary);border-radius:11px;padding:12px;font-weight:700;font-size:15px;margin-bottom:11px;display:flex;align-items:center;justify-content:center;gap:8px}
.biobtn:active{transform:scale(.98)}

/* confirm with distractors */
.ck.bad{border-color:var(--red);background:var(--red-lt)}
.ck.bad .box{background:var(--red);border-color:var(--red)}
.ck-note{font-size:13.5px;line-height:1.5;color:#7C2D12;margin:-5px 0 10px 41px;display:none}
.ck-note.show{display:block}

/* true false flip */
.tf-card{transform-style:preserve-3d}
.tf-card.flipping{animation:tfflip .62s cubic-bezier(.4,0,.2,1)}
@keyframes tfflip{0%{transform:perspective(1200px) rotateY(0);opacity:1}45%{transform:perspective(1200px) rotateY(90deg);opacity:.12}55%{transform:perspective(1200px) rotateY(-90deg);opacity:.12}100%{transform:perspective(1200px) rotateY(0);opacity:1}}
.tf-linda-box{background:var(--primary);border-radius:14px;padding:16px 17px;margin-top:14px}
.tf-linda-box .lcw{font-size:12px;font-weight:700;color:#BFE6F2;margin-bottom:5px}
.tf-linda-box .lct{font-size:16px;line-height:1.55;font-weight:600;color:#fff}

/* end button */
.endbtn{border:none;background:var(--primary);color:#fff;border-radius:11px;padding:13px 24px;font-weight:700;font-size:15px}
.endbtn:active{transform:scale(.97)}
/* ===== ENGINE: NEW INTERACTIONS ===== */
/* fill in the blank */
.bk-sent{font-size:18px;line-height:2.1;color:var(--ink);margin:6px 0 16px}
.bk-slot{display:inline-block;min-width:74px;border-bottom:2.5px dashed var(--primary);text-align:center;font-weight:700;color:var(--primary);padding:0 6px;margin:0 2px}
.bk-slot.filled{border-bottom-style:solid;background:var(--teal-lt);border-radius:6px 6px 0 0}
.bk-slot.ok{color:var(--green);border-color:var(--green);background:var(--green-lt)}
.bk-slot.no{color:var(--red);border-color:var(--red);background:var(--red-lt)}
.bk-chips{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}
.bk-chip{border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:9px 16px;font-size:15px;font-weight:600;color:var(--ink)}
.bk-chip.used{opacity:.32;pointer-events:none}
.bk-chip:active{transform:scale(.95)}
/* flashcard */
.fc{perspective:1400px;margin:8px 0 14px}
.fc-in{position:relative;transform-style:preserve-3d;transition:transform .55s var(--ease);min-height:200px}
.fc.flipped .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.fc-front{background:var(--primary);color:#fff}
.fc-front .fcq{font-size:20px;font-weight:700;line-height:1.5}
.fc-back{background:#fff;border:1.5px solid var(--line);transform:rotateY(180deg)}
.fc-back .fca{font-size:17px;line-height:1.6;color:var(--ink)}
.fc-tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-bottom:10px}
.fc-grade{display:flex;gap:10px}
.fc-grade button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px;font-size:15px;font-weight:700;color:var(--ink)}
.fc-grade .knew{border-color:var(--green);color:var(--green)}
.fc-grade .rev{border-color:var(--amber);color:var(--amber)}
/* match */
.mt-grid{display:flex;gap:12px}
.mt-col{flex:1;display:flex;flex-direction:column;gap:10px}
.mt-item{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px 12px;font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.4;text-align:left;min-height:54px;display:flex;align-items:center}
.mt-item.sel{border-color:var(--primary);background:var(--teal-lt)}
.mt-item.done{border-color:var(--green);background:var(--green-lt);color:#14532D;pointer-events:none}
.mt-item.miss{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* swipe sort */
.sw-buckets{display:flex;justify-content:space-between;margin-bottom:10px;gap:10px}
.sw-bucket{flex:1;text-align:center;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:10px;border-radius:12px;border:2px dashed var(--line);color:var(--muted)}
.sw-bucket.lt{color:var(--red)}.sw-bucket.rt{color:var(--green)}
.sw-stage{position:relative;height:240px;margin-bottom:14px}
.sw-card{position:absolute;inset:0;background:#fff;border:1.5px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(16,32,58,.12);display:flex;align-items:center;justify-content:center;text-align:center;padding:26px 22px;font-size:18px;font-weight:600;color:var(--ink);line-height:1.5;cursor:grab;touch-action:pan-y;user-select:none;overflow:hidden}
.sw-hint{position:absolute;top:14px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:0;transition:opacity .12s;padding:5px 10px;border-radius:20px}
.sw-hint.l{left:14px;color:#fff;background:var(--red)}.sw-hint.r{right:14px;color:#fff;background:var(--green)}
.sw-btns{display:flex;gap:10px}
.sw-btns button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px;font-size:15px;font-weight:700}
.sw-btns .bl{color:var(--red);border-color:var(--red-lt)}.sw-btns .br{color:var(--green);border-color:var(--green-lt)}
.sw-correct{font-size:13px;font-weight:700;text-align:center;margin-top:10px;min-height:18px}
.sw-count{text-align:center;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px}
.sw-result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;opacity:0;pointer-events:none;transition:opacity .18s;border-radius:16px}
.sw-result.show{opacity:1}
.sw-result.ok{background:rgba(22,163,74,.94);color:#fff}
.sw-result.no{background:rgba(220,38,38,.94);color:#fff}
.sw-result .ic{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.sw-result .lbl{font-size:19px;font-weight:800}
.sw-result .sub{font-size:14px;font-weight:600;opacity:.95;padding:0 22px;text-align:center;line-height:1.45}
/* slider */
.sl-wrap{margin:18px 0 8px}
.sl-val{text-align:center;font-size:34px;font-weight:800;color:var(--primary);margin-bottom:4px}
.sl-val .u{font-size:17px;font-weight:700;color:var(--muted);margin-left:3px}
.sl-track{position:relative;margin:18px 4px 6px}
.sl-track input[type=range]{width:100%;accent-color:var(--primary);height:26px}
.sl-band{position:absolute;top:-2px;height:8px;background:var(--green-lt);border:1.5px solid var(--green);border-radius:6px;opacity:0;transition:opacity .3s}
.sl-band.show{opacity:1}
.sl-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
/* chat */
.ch-thread{display:flex;flex-direction:column;gap:10px;margin:6px 0 12px;min-height:60px}
.ch-msg{max-width:82%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.5;animation:cardIn .3s both}
.ch-them{align-self:flex-start;background:#F1F4F8;color:var(--ink);border-bottom-left-radius:5px}
.ch-you{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:5px}
.ch-who{font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 -4px 4px}
.ch-choices{display:flex;flex-direction:column;gap:9px}
.ch-choices button{border:1.5px solid var(--primary);background:#fff;color:var(--primary);border-radius:14px;padding:12px 14px;font-size:14.5px;font-weight:600;text-align:left;line-height:1.45}
.ch-choices button:active{transform:scale(.98)}
/* compare */
.cmp{position:relative;border-radius:16px;overflow:hidden;margin:8px 0 4px;aspect-ratio:4/3;background:#0b1220;user-select:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .cmp-after{clip-path:inset(0 0 0 50%)}
.cmp .cmp-div{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.cmp .cmp-knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:16px;font-weight:800}
.cmp-lbl{position:absolute;bottom:10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:rgba(8,15,30,.55);padding:5px 10px;border-radius:20px}
.cmp-lbl.l{left:10px}.cmp-lbl.r{right:10px}
.cmp-range{width:100%;margin-top:10px;accent-color:var(--primary)}
/* branch */
.br-paths{display:flex;flex-direction:column;gap:10px}
.br-path{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-size:15px;font-weight:600;color:var(--ink);text-align:left;line-height:1.45}
.br-path:active{transform:scale(.99)}
.br-path.dis{opacity:.4;pointer-events:none}
.br-path.pick{border-color:var(--primary)}
.br-out{margin-top:14px;border-radius:14px;padding:15px 16px;font-size:15px;line-height:1.6;display:none}
.br-out.show{display:block;animation:cardIn .35s both}
.br-out.good{background:var(--green-lt);color:#14532D}
.br-out.bad{background:var(--red-lt);color:#7C2D12}
.br-out.ok{background:var(--teal-lt);color:#0c5460}
.br-conv{margin-top:10px;font-size:14.5px;line-height:1.6;color:var(--ink);font-weight:600}
/* reflect */
.rf-area{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:16px;font-family:inherit;color:var(--ink);line-height:1.5;min-height:96px;resize:vertical}
.rf-area:focus{outline:none;border-color:var(--primary)}
.rf-ack{margin-top:12px;background:var(--green-lt);color:#14532D;border-radius:12px;padding:14px;font-size:15px;line-height:1.55;display:none}
.rf-ack.show{display:block;animation:cardIn .35s both}
/* ===== PRESENTATION LAYOUTS ===== */
.stat-wrap{text-align:center;padding:28px 10px 14px}
.stat-kick{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
.stat-big{font-size:64px;font-weight:800;color:var(--primary);line-height:1.04;letter-spacing:-.02em}
.stat-label{font-size:19px;font-weight:700;color:var(--ink);margin-top:10px;line-height:1.4}
.stat-sub{font-size:15.5px;line-height:1.6;color:var(--muted);margin-top:12px}
.hero{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:3/4;margin:8px 0;background:#0b1220}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,15,30,.92) 8%,rgba(8,15,30,.32) 46%,rgba(8,15,30,.04) 76%)}
.hero-body{position:absolute;left:20px;right:20px;bottom:22px;color:#fff}
.hero-eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9FE0EE;margin-bottom:8px}
.hero-h{font-size:26px;font-weight:800;line-height:1.22}
.hero-t{font-size:15.5px;line-height:1.6;margin-top:10px;color:#E7ECF4}
.kp-list{margin-top:6px}
.kp-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);opacity:0;animation:kpIn .45s var(--ease) forwards}
@keyframes kpIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.kp-item:nth-child(1){animation-delay:.05s}
.kp-item:nth-child(2){animation-delay:.20s}
.kp-item:nth-child(3){animation-delay:.35s}
.kp-item:nth-child(4){animation-delay:.50s}
.kp-item:nth-child(5){animation-delay:.65s}
.kp-item:last-child{border-bottom:none}
.kp-ic{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--teal-lt);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-top:1px}
.kp-h{font-size:16px;font-weight:700;color:var(--ink)}
.kp-t{font-size:14.5px;line-height:1.55;color:var(--muted);margin-top:2px}
.note{border-radius:14px;padding:16px;border-left:5px solid var(--primary);background:var(--teal-lt);margin:10px 0}
.note.tip{border-color:var(--green);background:var(--green-lt)}
.note.warn{border-color:var(--amber);background:var(--amber-lt)}
.note.info{border-color:var(--primary);background:var(--teal-lt)}
.note-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin-bottom:6px}
.note.tip .note-h{color:#14653A}.note.warn .note-h{color:#92400E}.note.info .note-h{color:var(--primary-dk)}
.note-t{font-size:15px;line-height:1.6;color:var(--ink)}
.note-ic{font-size:16px}
.note-lead{font-size:16px;line-height:1.65;color:var(--ink);margin-bottom:14px}
.note-eye{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:11px;position:relative;z-index:1}
.note-spot{position:relative;min-height:300px;border-radius:18px;padding:34px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:13px;margin:6px 0}
.note-spot.info{background:linear-gradient(180deg,#F3FAFD,#E2F6FB)}
.note-spot.warn{background:linear-gradient(180deg,#FFF9F0,#FCEFD8)}
.note-spot.tip{background:linear-gradient(180deg,#F1FBF5,#DCFCE7)}
.note-spot .note-spot-ic{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(16,32,58,.18)}
.note-spot.info .note-spot-ic{background:var(--primary);color:#fff}
.note-spot.warn .note-spot-ic{background:var(--amber);color:#fff}
.note-spot.tip .note-spot-ic{background:var(--green);color:#fff}
.note-spot.info .note-eye{color:var(--primary-dk)}
.note-spot.warn .note-eye{color:#92400E}
.note-spot.tip .note-eye{color:#14653A}
.note-spot h3{font-size:23px;font-weight:800;margin:0;line-height:1.22;color:var(--ink)}
.note-spot p{font-size:15.5px;line-height:1.6;color:#3A4256;margin:0;max-width:32ch}
.note-screen{position:relative;min-height:300px;border-left:8px solid var(--primary);padding:34px 24px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;border-radius:0 16px 16px 0;margin:6px 0}
.note-screen.warn{border-left-color:var(--amber)}
.note-screen.tip{border-left-color:var(--green)}
.note-screen .note-wm{position:absolute;right:-20px;top:-12px;opacity:.08;pointer-events:none}
.note-screen .note-wm svg{width:165px;height:165px}
.note-screen.info .note-wm,.note-screen.info .note-wm svg{color:var(--primary)}
.note-screen.warn .note-wm,.note-screen.warn .note-wm svg{color:var(--amber)}
.note-screen.tip .note-wm,.note-screen.tip .note-wm svg{color:var(--green)}
.note-screen.info .note-eye{color:var(--primary-dk)}
.note-screen.warn .note-eye{color:#92400E}
.note-screen.tip .note-eye{color:#14653A}
.note-screen h3{font-size:24px;font-weight:800;margin:0 0 14px;line-height:1.22;color:var(--ink);position:relative;z-index:1}
.note-screen p{font-size:16px;line-height:1.65;color:#3A4256;margin:0;position:relative;z-index:1}
.stp{margin-top:8px}
.stp-item{display:flex;gap:14px;position:relative;padding-bottom:18px}
.stp-item:last-child{padding-bottom:0}
.stp-num{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;z-index:1}
.stp-item:not(:last-child)::before{content:"";position:absolute;left:15.5px;top:32px;bottom:0;width:2px;background:var(--line)}
.stp-t{font-size:15.5px;line-height:1.55;color:var(--ink);padding-top:5px}
.stp-t b{color:var(--primary)}
.ci-grid{display:flex;gap:10px;margin-top:8px}
.ci-col{flex:1;border-radius:14px;padding:14px 12px;border:1.5px solid var(--line)}
.ci-col.good{background:var(--green-lt);border-color:#BBF7D0}
.ci-col.avoid{background:var(--red-lt);border-color:#FECACA}
.ci-head{font-size:14px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ci-col.good .ci-head{color:#14653A}.ci-col.avoid .ci-head{color:#991B1B}
.ci-li{font-size:13.5px;line-height:1.5;color:var(--ink);padding:7px 0;border-top:1px solid rgba(0,0,0,.06)}
.ci-li:first-of-type{border-top:none}
</style>
</head>

var CARDS=[{"type":"cover","sec":0},{"type":"opener","sec":0,"cta":"Start your shift","kick":"7:14 AM, Oak Wing","q":"Your first task of the shift, and a small choice.","scn":"You arrive at Sunrise Ridge Residential Care. A spray bottle sits on the housekeeping cart with its label half peeled off. The washroom needs cleaning before breakfast. What do you do?","a":{"ei":"🧴","t":"Use it. It is probably just the usual cleaner."},"b":{"ei":"🔎","t":"Stop. Find out what is actually in it first."},"revealA":"Tempting on a busy morning. But a bottle you cannot identify could be a strong disinfectant, a descaler, or two products someone mixed together. Without the label you have no idea what it can do to your skin, your lungs, or a resident. This course is about closing that gap.","revealB":"Good instinct. A container with no clear label is a stop sign. By the end of this short course you will read any product at Sunrise Ridge with confidence, in seconds."},{"type":"beat","sec":0,"img":"img/RCW-05-C01.jpg","ratio":"4/3","html":"<div class=\"eyebrow\">Welcome to Sunrise Ridge</div><p>You are a care aide here. Across one shift you handle <strong>cleaners, disinfectants, bleach, alcohol hand rub, and oxygen</strong>, often with residents close by.</p><p>Almost every one of these is a hazardous product. <strong>WHMIS</strong> is the system that tells you, fast, what a product can do and how to use it safely.</p>"},{"type":"donut","sec":0,"title":"How WHMIS protects you","text":"Three parts work together. The label is the quick warning on the container. The safety data sheet (SDS) is the full manual. Your training, which is this, ties them together so you know what to do."},{"type":"keypoints","sec":0,"title":"Why this matters to you","intro":"Get WHMIS wrong and the results are real, and fast.","points":[{"h":"Burns","t":"A corrosive cleaner can damage skin and eyes in seconds."},{"h":"Bad air","t":"Mixing the wrong products, like bleach and other cleaners, makes a toxic gas."}, -14.2 5.86-21.86l-32.02-55.43c-4.42-7.65-14.21-10.28-21.87-5.86l-135.93 78.43V16c0-8.84-7.17-16-16.01-16h-64.04c-8.84 0-16.01 7.16-16.01 16v156.86L56.04 94.43c-7.66-4.42-17.45-1.79-21.87 5.86L2.15 155.71c-4.42 7.65-1.8 17.44 5.86 21.86L143.94 256 8.01 334.43c-7.66 4.42-10.28 14.21-5.86 21.86l32.02 55.43c4.42 7.65 14.21 10.27 21.87 5.86l135.93-78.43V496c0 8.84 7.17 16 16.01 16h64.04c8.84 0 16.01-7.16 16.01-16V339.14l135.93 78.43c7.66 4.42 17.45 1.8 21.87-5.86l32.02-55.43c4.42-7.65 1.8-17.43-5.86-21.85z\"></path></svg></svg>","r":"Long term harm to health"}],"fb":"Symbol to hazard, every time. The picture inside the red diamond tells you the danger before you open the cap."},{"type":"truefalse","sec":1,"title":"Quick check","q":"Tap true or false for each statement.","cards":[{"text":"A product with no label is fine to use if it smells like a normal cleaner.","correct":false,"fb":"False. No label means stop. Smell tells you nothing reliable about the hazard."},{"text":"The red border is the warning, and the symbol inside tells you the type of hazard.","correct":true,"fb":"Correct. Spot the diamond, then read the symbol."},{"text":"Alcohol hand rub is flammable, so keep it away from heat and open flame.","correct":true,"fb":"Correct. It carries the flame pictogram for a reason."}],"linda":"Reading the diamond takes two seconds and saves you from the worst surprises."},{"type":"section","sec":2,"cta":"Step onto the floor","num":"02","name":"Section two","title":"On the floor","sub":"Real moments from a shift at Sunrise Ridge"},{"type":"beat","sec":2,"img":"img/RCW-05-C02.jpg","ratio":"4/3","html":"<div class=\"eyebrow\">Mid morning, Room 14</div><p>Mr. Alvarez uses oxygen at his bedside. His side table needs a wipe down, and a coworker hands you an aerosol cleaner and an alcohol spray.</p><p>Time to put the symbols to work.</p>"},{"type":"swipesort","sec":2,"title":"Safe or unsafe","q":"Swipe each action, or use the buttons. Is it safe at Sunrise Ridge?","left":"Unsafe","right":"Safe","items":[{"t":"Spray an aerosol cleaner right next to a running oxygen cylinder.","side":"left"},{"t":"Read the label before opening a product you have not used before.","side":"right"},{"t":"Pour bleach into an unlabelled bottle and leave it on the cart.","side":"left"},{"t":"Open a window and wear gloves when using a strong disinfectant.","side":"right"},{"t":"Mix two cleaners together to get the job done faster.","side":"left"},{"t":"Check the safety data sheet when you are not sure how to use a product.","side":"right"}],"done":"Nicely sorted. Most unsafe moments come down to the same few habits: skipping the label, mixing products, and using flammables near oxygen or heat."},{"type":"decision","sec":2,"q":"The only spray left on the cart has a flame pictogram, and Mr. Alvarez is on oxygen. Do you stop and switch to a safer method?","yes":"Stop and switch","no":"Spray it, just a little","goodHead":"Good call","good":"You set the flammable spray aside and wipe the table with a damp cloth and a non flammable cleaner, away from the oxygen. Quiet, safe, done.","badHead":"That is a risk you do not want","bad":"Oxygen makes things catch fire more easily and burn hotter. A flammable spray near a running oxygen source can turn a small ignition into a serious fire, with a resident right there.","badLinda":"The flame pictogram plus oxygen is a clear no. There is almost always a safer way to do the same task.","fin":"What should happen: keep flammable products away from oxygen and heat, choose a non flammable option, and let in air. The pictogram warned you before you ever opened the cap."},{"type":"chat","sec":2,"title":"In the sluice room","who":"Dani, your coworker","thread":[{"them":"This toilet is bad. Let us mix the bleach with that other cleaner, it works way better."},{"choose":[{"t":"Sure, more power is better.","good":false,"reply":"Wait, my eyes are really stinging now."},{"t":"No. Mixing bleach with other cleaners can make a toxic gas. We use one product as directed.","good":true,"reply":"Oh. I did not know that. Good catch."},{"t":"Maybe just a little bit?","good":false,"reply":"It is getting hard to breathe in here."}]},{"them":"So what do we do instead?"},{"choose":[{"t":"Use the bleach product on its own, follow the label, and open the door for air.","good":true,"reply":"On it. Door open, gloves on."}]}],"done":"Exactly right. Bleach mixed with ammonia or acid based cleaners can release dangerous gases. One product, as the label directs, with good air flow.","doneBad":"Mixing bleach with other cleaners can release chlorine type gases that burn the eyes and lungs. Never mix. Use one product as directed and ventilate."},{"type":"hold","sec":2,"intro":"A new bottle of disinfectant for soaking instruments is on the bench.","sub":"Press and hold to read the label and the safety data sheet before you open it.","done":"Label read. You spotted the health hazard symbol, so you will ventilate and wear gloves before you start.","fail":"You let go early. Reading the label is the one step worth slowing down for."},{"type":"confirm","sec":2,"title":"Before you use any product","q":"Tap the steps you should actually take before using a hazardous product. Some do not belong.","items":["Read the label: name, pictograms, and precautions.","Check the safety data sheet if you are unsure.","Put on the protection the label calls for.",{"t":"Pour it into any spare bottle to save time.","bad":true,"note":"No. A container with no label is a hazard. If you decant a product, you must label it."},"Make sure the area has air flow.",{"t":"Mix it with another cleaner for a stronger result.","bad":true,"note":"No. Never mix products unless the label says it is safe."}],"done":"That is the habit: read, check, protect, ventilate. Every product, every time."},{"type":"section","sec":3,"cta":"Wrap up","num":"03","name":"Section three","title":"Lock it in","sub":"Make it stick for your next shift"},{"type":"note3","sec":3,"tone":"warn","lead":"One line to carry with you.","title":"No label, no use","text":"If a container is not labelled, or you cannot tell what is in it, stop and find out. That one habit prevents most chemical injuries in care."},{"type":"keypoints","sec":3,"title":"Your WHMIS habits","intro":"Five things that keep you safe at Sunrise Ridge.","points":[{"h":"Read the diamond","t":"Red border is the warning, the symbol is the hazard."},{"h":"Label first","t":"No clear label means stop and check."},{"h":"Use the SDS","t":"The safety data sheet has first aid and safe handling."},{"h":"Never mix","t":"One product, as directed. Mixing can make toxic gas."},{"h":"Flammables and oxygen","t":"Keep flame pictogram products away from oxygen and heat."}]},{"type":"reflect","sec":3,"title":"Make it personal","q":"What is one WHMIS habit you will use on your very next shift at Sunrise Ridge?","placeholder":"Type your commitment here","commit":"Commit to this","ack":"<div style='font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#14653A;margin-bottom:6px'>Expert's answer</div><div>Before I use any product, I will read the label and its pictograms first. If a container is not clearly labelled, I will stop and check the safety data sheet or ask, instead of guessing.</div>"},{"type":"recap","sec":3,"title":"What you can now do","items":["Read the common WHMIS pictograms: corrosion, exclamation mark, flame, gas cylinder, health hazard, and biohazardous.","Treat a container with no clear label as a stop sign.","Find first aid and safe handling steps on the safety data sheet.","Avoid the big three risks: mixing products, skipping protection, and flammables near oxygen.","Ask or check whenever you are not sure."]},{"type":"complete","sec":3}];

function pgSized(kind,px){return PICTO[kind].replace('class="pg"','width="'+px+'" height="'+px+'" class="pg"');}
function coverHTML(){return '<div class="cover" style="padding:18px 0 0"><img class="scene-img" style="aspect-ratio:4/3" src="img/cover.jpg" alt=""><div class="eyebrow">Residential care safety</div><h2 style="font-weight:800">WHMIS at Sunrise Ridge</h2><p style="margin-top:12px">A short, hands on course. Step into a shift, learn the hazard symbols, and make the calls that keep you and your residents safe.</p><div class="cover-cta"><button onclick="advance()">Start your shift '+CHEV+'</button></div></div>';}
function sectionHTML(c){return '<div style="padding-top:6px"><div class="sectioncard"><div class="sc-text"><div class="num">'+c.num+'</div><h2>'+c.title+'</h2></div>'+(SECIMG[c.sec]?'<img class="sc-icon" src="'+SECIMG[c.sec]+'" onerror="this.style.display=\'none\'" alt="">':'')+'</div><div class="sc-meta"><div class="nm">'+c.name+'</div>'+(c.sub?'<div class="t">'+c.sub+'</div>':'')+'</div></div>';}
function completeHTML(){return '<div class="done-wrap"><div class="done-ring">\u2713</div><h2>Shift complete.</h2><p>You can now read the diamond, find the safety data sheet, and stop when something is not labelled. That is exactly what keeps Sunrise Ridge safe. Your progress has been recorded.</p><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="replay" onclick="restart()">Replay the course</button><button class="endbtn" onclick="endCourse()">Finish</button></div></div>';}
function pictointroHTML(c){return '<div style="padding:10px 0"><div class="eyebrow">How to read a pictogram</div><p style="font-size:19px;line-height:1.6;color:var(--ink);margin-bottom:15px">Every WHMIS symbol comes inside a <strong>red diamond</strong>. Spot the red border first, then read the black picture inside to see which hazard it is.</p><div style="display:flex;align-items:center;gap:16px;background:#F7F9FB;border:1px solid var(--line);border-radius:16px;padding:16px"><div style="width:118px;height:118px;flex-shrink:0">'+pgSized(c.kind,118)+'</div><div style="font-size:15px;line-height:1.5"><div style="margin-bottom:12px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:8px"></span><strong style="color:var(--red)">Red border</strong><br><span style="color:var(--muted)">a hazard warning, stop and look</span></div><div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ink);margin-right:8px"></span><strong>Black symbol</strong><br><span style="color:var(--muted)">tells you which hazard it is</span></div></div></div></div>';}
function pictoHTML(c){return '<div style="padding:10px 0"><div style="display:flex;justify-content:center"><div style="width:138px;height:138px">'+pgSized(c.kind,138)+'</div></div><h2 style="text-align:center;font-size:24px;font-weight:800;color:var(--primary);margin:8px 0 5px">'+c.name+'</h2><p style="text-align:center;font-size:17px;line-height:1.55;color:var(--ink);margin:0 auto 16px;max-width:30em">'+c.means+'</p><div style="background:var(--teal-lt);border-radius:14px;padding:13px 15px;margin-bottom:10px"><div style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--primary);margin-bottom:4px">At Sunrise Ridge</div><div style="font-size:15.5px;line-height:1.5;color:var(--ink)">'+c.eg+'</div></div><div style="background:var(--red-lt);border-radius:14px;padding:13px 15px"><div style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#991B1B;margin-bottom:4px">If you ignore it</div><div style="font-size:15.5px;line-height:1.5;color:#7F1D1D">'+c.ignore+'</div></div></div>';}
function donutSVG(){return '<svg viewBox="0 0 120 120" style="width:100%;height:100%"><circle cx="60" cy="60" r="42" fill="none" stroke="#EEF2F6" stroke-width="20"/><circle cx="60" cy="60" r="42" fill="none" stroke="var(--primary)" stroke-width="20" stroke-dasharray="87.96 175.93" stroke-dashoffset="0" transform="rotate(-90 60 60)" stroke-linecap="butt"/><circle cx="60" cy="60" r="42" fill="none" stroke="var(--teal)" stroke-width="20" stroke-dasharray="87.96 175.93" stroke-dashoffset="-87.96" transform="rotate(-90 60 60)"/><circle cx="60" cy="60" r="42" fill="none" stroke="#16A34A" stroke-width="20" stroke-dasharray="87.96 175.93" stroke-dashoffset="-175.93" transform="rotate(-90 60 60)"/><text x="60" y="63" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)" font-family="Inter,sans-serif">WHMIS</text></svg>';}
function donutHTML(c){var leg=[['var(--primary)','Labels','the quick warning on the bottle'],['var(--teal)','Safety data sheets','the full detail when you need it'],['#16A34A','Training','that is you, right now']];var li=leg.map(function(x){return '<div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:11px"><span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:'+x[0]+';margin-top:3px;flex-shrink:0"></span><div><div style="font-weight:700;font-size:15px;color:var(--ink)">'+x[1]+'</div><div style="font-size:13.5px;color:var(--muted);line-height:1.45">'+x[2]+'</div></div></div>';}).join('');return '<div style="padding:10px 0"><h2 style="margin-bottom:4px">'+c.title+'</h2><p style="color:var(--muted);font-size:15.5px;line-height:1.6;margin:6px 0 16px">'+c.text+'</p><div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center"><div style="width:176px;height:176px;flex-shrink:0">'+donutSVG()+'</div><div style="min-width:180px;flex:1">'+li+'</div></div></div>';}

function save(){try{localStorage.setItem('sr-whmis-sunriseridge-v1',JSON.stringify({cur:cur,done:Object.keys(done),reached:Object.keys(reached)}));}catch(e){}}
function load(){try{var d=JSON.parse(localStorage.getItem('sr-whmis-sunriseridge-v1'));if(d){d.done.forEach(function(k){done[k]=true;});d.reached.forEach(function(k){reached[k]=true;});return d.cur;}}catch(e){}return null;}

function buildTicks(){ticksEl.innerHTML='';for(var i=0;i<SECTIONS.length;i++){ticksEl.innerHTML+='<div class="t" data-s="'+i+'"><i></i></div>';}}
function paintTicks(){var card=CARDS[cur];document.querySelectorAll('#ticks .t').forEach(function(t){var si=+t.dataset.s,bar=t.querySelector('i');if(si<card.sec)bar.style.width='100%';else if(si>card.sec)bar.style.width='0%';else{var list=secCards[si];bar.style.width=Math.round(((list.indexOf(cur)+1)/list.length)*100)+'%';}});}

function confetti(){var box=document.getElementById('confetti');var cols=['#0E9DBD','#0475AC','#16A34A','#D97706'];for(var i=0;i<26;i++){var d=document.createElement('div');d.className='cf';d.style.left=(15+Math.random()*70)+'%';d.style.top='28%';d.style.background=cols[i%4];d.style.animationDelay=(Math.random()*.2)+'s';box.appendChild(d);setTimeout((function(el){return function(){el.remove();};})(d),1300);}}
function vibe(p){if(navigator.vibrate)navigator.vibrate(p);}

function setNav(){
  var card=CARDS[cur];
  if(card.type==='cover'){navBar.style.display='none';return;}
  navBar.style.display='flex';
  back.classList.toggle('hide',cur===0);
  if(card.type==='complete'){fwd.style.display='none';tapcue.classList.remove('show');return;}
  fwd.style.display='flex';
  var locked=GATED[card.type]&&!done[cur];
  if(locked){fwd.className='icon locked';fwd.innerHTML=CHEV;}
  else if(card.cta){fwd.className='';fwd.innerHTML=card.cta+CHEV;}
  else{fwd.className='icon';fwd.innerHTML=CHEV;}
  var showCue=CUE[card.type]&&!locked;
  tapcue.classList.toggle('show',!!showCue);
}
function markDone(){if(!done[cur]){done[cur]=true;setNav();save();}}

function render(){
  var card=CARDS[cur];reached[card.sec]=true;
  var olds=stage.querySelectorAll('.card');
  olds.forEach(function(o){o.classList.add('out');setTimeout((function(n){return function(){n.remove();};})(o),210);});
  var old=olds.length?olds[0]:null;
  var el=document.createElement('div');el.className='card';el.style.animationDelay=old?'.16s':'0s';
  el.innerHTML=renderHTML(card);
  setTimeout(function(){stage.querySelectorAll('.card.out').forEach(function(o){o.remove();});stage.appendChild(el);wire(card,el);stage.scrollTop=0;},old?170:0);
  if(SHOW_CLOCK){clockEl.style.display='inline-flex';clockT.textContent=card.time;}
  secLabel.textContent=card.type==='cover'?'Getting started':SECTIONS[card.sec];
  paintTicks();setNav();save();
  if(card.type==='complete')SCORM.done();
}

/* ---------- RENDER ---------- */
function renderHTML(c){
  switch(c.type){
  case 'cover':return coverHTML();
  case 'opener':return openerHTML(c);
  case 'section':return sectionHTML(c);
  case 'pictointro':return pictointroHTML(c);
  case 'picto':return pictoHTML(c);
  case 'donut':return donutHTML(c);
  case 'beat':return '<div class="beat">'+(c.img?'<img class="scene-img" style="aspect-ratio:'+(c.ratio||'16/9')+'" src="'+c.img+'" onerror="this.style.display=\'none\'" alt="">':'')+c.html+'</div>';
  case 'callout':return calloutHTML(c);
  case 'hotspot':return hotspotHTML(c);
  case 'checkbio':return checkbioHTML(c);
  case 'quote':return '<div class="quote"><span class="qm">&ldquo;</span><div class="qt">'+c.qt+'</div><div class="by">'+av(c.who,c.color)+'<div><div class="nm">'+c.who+'</div><div class="rl">'+c.role+'</div></div></div></div>';
  case 'plan':return planHTML(c);
  case 'learn':return learnHTML(c);
  case 'order':return orderHTML(c);
  case 'mcq':return choiceHTML(c,false);
  case 'multi':return choiceHTML(c,true);
  case 'truefalse':return tfHTML(c);
  case 'confirm':return confirmHTML(c);
  case 'decision':return decisionHTML(c);
  case 'tapreveal':return tapHTML(c);
  case 'hold':return holdHTML(c);
  case 'recap':return recapHTML(c);
  case 'blank':return blankHTML(c);
  case 'flashcard':return flashHTML(c);
  case 'match':return matchHTML(c);
  case 'swipesort':return swipeHTML(c);
  case 'slider':return sliderHTML(c);
  case 'chat':return chatHTML(c);
  case 'compare':return compareHTML(c);
  case 'pinpoint':return pinpointHTML(c);
  case 'branch':return branchHTML(c);
  case 'reflect':return reflectHTML(c);
  case 'stat':return statHTML(c);
  case 'hero':return heroHTML(c);
  case 'keypoints':return keypointsHTML(c);
  case 'note':return noteHTML(c);
  case 'note2':return note2HTML(c);
  case 'note3':return note3HTML(c);
  case 'steps':return stepsHTML(c);
  case 'compareinfo':return compareInfoHTML(c);
  case 'complete':return completeHTML();
  }
  return '';
}

function openerHTML(c){
  return '<div class="opener" style="padding:12px 0"><div class="kick">'+c.kick+'</div><h2>'+c.q+'</h2><div class="scn">'+c.scn+'</div>'+
  '<div class="op-choice" id="op-choice"><button class="op-btn" data-pick="a"><span class="ei">'+c.a.ei+'</span><span>'+c.a.t+'</span></button><button class="op-btn" data-pick="b"><span class="ei">'+c.b.ei+'</span><span>'+c.b.t+'</span></button></div>'+
  '<div class="op-reveal" id="op-reveal"><span class="tag" id="op-tag"></span><div id="op-text"></div></div></div>';
}
function planHTML(c){
  var rows='';c.rows.forEach(function(r){rows+='<div class="prow"><div class="pi '+r.c+'">&#9679;</div><div><div class="pl '+r.c+'">'+r.l+'</div><div class="pt">'+r.t+'</div></div></div>';});
  var tags=c.sub.map(function(s){return '<span class="pill">'+s+'</span>';}).join('');
  var front='<div class="flip-face flip-front"><div class="pfimg"><div class="pf-fallback" style="background:'+c.color+'">'+initialOf(c.who)+'</div><img src="'+portraitOf(c.who)+'" onerror="this.style.display=\'none\'" alt=""><div class="pfshade"></div></div><div class="pfinfo"><div class="fname">'+c.who+'</div><div class="ftags">'+tags+'</div><span class="prompt"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2-9.5L1 10"/></svg> Tap to open the handling plan</span></div></div>';
  return '<div class="flip" id="flip" onclick="flipPlan()"><div class="flip-in">'+front+
    '<div class="flip-face flip-back"><div class="bh"><span class="bn">'+c.who+'</span><span class="bf"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2-9.5L1 10"/></svg> tap to flip back</span></div><div class="bb">'+rows+(c.alert?'<div class="palert">'+c.alert+'</div>':'')+'</div></div>'+
    '</div></div>';
}
function learnHTML(c){
  var lis=c.bullets.map(function(b){var m=b.indexOf(':');if(m>0&&m<42){b='<strong>'+b.slice(0,m)+'</strong>'+b.slice(m);}return '<li><div class="lb-txt">'+b+'</div></li>';}).join('');
  return '<div style="padding:12px 0"><div class="learn"><div class="hd"><h3>'+c.title+'</h3></div><div class="bd"><p>'+c.intro+'</p><ul>'+lis+'</ul><div class="hl">'+c.hl+'</div></div></div></div>';
}
function orderHTML(c){
  var items=c.items.map(function(it){return '<div class="oitem" data-correct="'+it.correct+'"><div class="ot">'+it.t+'</div><div class="obtns"><button class="ob up">&#9650;</button><button class="ob dn">&#9660;</button></div></div>';}).join('');
  return '<div style="padding:8px 0"><div class="act"><div class="tag">Activity · Order the steps</div><h3>'+c.title+'</h3><p class="q">'+c.q+'</p><div id="ord-list">'+items+'</div><button class="subbtn" id="ord-sub">Check order</button><div class="fb" id="ord-fb"></div></div></div>';
}
function choiceHTML(c,multi){
  var opts=c.opts.map(function(o){return '<div class="opt" data-k="'+o.k+'"><div class="lt">'+o.k+'</div><div class="ox">'+o.t+'</div></div>';}).join('');
  return '<div style="padding:8px 0"><div class="act"><div class="tag">Activity · '+(multi?'Select all that apply':'Choose one')+'</div><p class="q">'+c.q+'</p><div id="ch-opts">'+opts+'</div><button class="subbtn" id="ch-sub" disabled>Submit</button><div class="fb" id="ch-fb"></div></div></div>';
}
function tfHTML(c){
  return '<div style="padding:8px 0"><div class="act"><div class="tag">Activity · True or false</div><h3>'+c.title+'</h3><p class="q" style="margin-bottom:10px">'+c.q+'</p><div class="tf-pb"><div class="tf-pf" id="tf-pf"></div></div><div class="tf-ct" id="tf-ct"></div><div class="tf-card"><div class="tf-txt" id="tf-txt"></div></div><div class="tf-btns"><button class="tf-btn tf-t" id="tf-true">&#10003; True</button><button class="tf-btn tf-f" id="tf-false">&#10007; False</button></div><div class="tf-fb" id="tf-fb"></div><button class="tf-nx" id="tf-nx">Next statement</button><div id="tf-end" style="display:none"><div class="tf-linda-box"><div class="lcw">Linda</div><div class="lct">'+c.linda+'</div></div></div></div></div>';
}
function confirmHTML(c){
  var items=c.items.map(function(it,i){var t=(typeof it==='string')?it:it.t;var bad=(typeof it==='object'&&it.bad)?1:0;var note=(typeof it==='object'&&it.note)?it.note:'';return '<div class="ck" data-i="'+i+'" data-bad="'+bad+'"><div class="box">&#10003;</div><div class="ckt">'+t+'</div></div>'+(bad?'<div class="ck-note" data-i="'+i+'">'+note+'</div>':'');}).join('');
  return '<div style="padding:8px 0"><div class="act"><div class="tag" style="background:var(--teal)">Confirm each point</div><h3>'+c.title+'</h3><p class="q">'+c.q+'</p><div id="ck-list">'+items+'</div><div class="ck-done" id="ck-done">'+c.done+'</div></div></div>';
}
function calloutHTML(c){
  var kick=c.kick?'<div class="co-kick"'+(c.urgent?' style="background:var(--red)"':'')+'>'+c.kick+'</div>':'';
  return '<div class="callout'+(c.focus?' focus':'')+'" style="aspect-ratio:'+(c.ratio||'4/5')+'">'+kick+'<img class="coimg" src="'+c.img+'" onerror="this.style.display=\'none\'" alt=""><div class="coshade"></div><div class="cobubble"><div class="cot">&ldquo;'+c.text+'&rdquo;</div></div></div>';
}
function hotspotHTML(c){
