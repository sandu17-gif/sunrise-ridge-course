<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Moments · Safe Handling</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sr-primary:#0475AC;
    --sr-teal:#0F6E56;
    --sr-teal-light:#1D9E75;
    --sr-amber:#BA7517;
    --sr-red:#A32D2D;
    --ink:#0E1B2A;
    --paper:#F4F6F8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:#000;color:#fff;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  #phone{
    position:relative;
    width:100%;height:100%;
    max-width:430px;max-height:932px;
    background:var(--ink);
    overflow:hidden;
  }

  .moment{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    opacity:0;transform:translateY(24px);
    pointer-events:none;
    transition:opacity .5s ease, transform .5s ease;
  }
  .moment.active{opacity:1;transform:translateY(0);pointer-events:auto;}

  .scene{
    position:absolute;inset:0;z-index:0;
    transition:filter .6s ease, transform 6s ease;
  }
  .scene::after{
    content:attr(data-label);
    position:absolute;top:14px;left:0;right:0;text-align:center;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:rgba(255,255,255,.32);
  }
  .scene-dawn{background:
    radial-gradient(120% 80% at 70% 0%, #2b4a63 0%, #16293b 45%, #0c1825 100%);}
  .scene-room{background:
    radial-gradient(130% 90% at 30% 10%, #3a4a5e 0%, #1c2937 50%, #101b27 100%);}
  .scene-bedside{background:
    radial-gradient(120% 90% at 60% 20%, #43566b 0%, #243343 55%, #131f2b 100%);}
  .scene-hall{background:
    radial-gradient(140% 90% at 50% 0%, #324b5a 0%, #1a2a37 50%, #0e1823 100%);}
  .scene-close{background:
    radial-gradient(120% 100% at 50% 100%, #1d6e56 0%, #114433 45%, #0c1f1a 100%);}
  .tint-bad{filter:saturate(.7) brightness(.82) hue-rotate(-12deg);}

  .topbar{
    position:relative;z-index:3;
    display:flex;align-items:center;gap:10px;
    padding:14px 18px 0;
  }
  .clock{
    display:inline-flex;align-items:center;gap:7px;
    background:rgba(0,0,0,.32);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.14);
    padding:6px 12px;border-radius:999px;
    font-size:13px;font-weight:600;letter-spacing:.02em;
  }
  .clock .dot{width:7px;height:7px;border-radius:50%;background:var(--sr-teal-light);box-shadow:0 0 8px var(--sr-teal-light);}
  .wing{font-size:12px;color:rgba(255,255,255,.6);font-weight:500;}
  .dots{margin-left:auto;display:flex;gap:5px;}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22);transition:background .3s;}
  .dots i.on{background:#fff;}

  .spacer{flex:1;position:relative;z-index:2;}

  .panel{
    position:relative;z-index:3;
    padding:22px 22px calc(26px + env(safe-area-inset-bottom));
  }
  .eyebrow{
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--sr-teal-light);font-weight:600;margin-bottom:8px;
  }
  .speaker{font-size:12px;color:rgba(255,255,255,.55);font-weight:600;margin-bottom:4px;}
  .line{font-size:19px;line-height:1.5;font-weight:500;}
  .line.big{font-size:24px;line-height:1.35;font-weight:600;}
  .sub{font-size:15px;line-height:1.55;color:rgba(255,255,255,.72);margin-top:10px;font-weight:400;}

  .tap-hint{
    position:absolute;right:22px;bottom:calc(30px + env(safe-area-inset-bottom));
    z-index:4;display:flex;align-items:center;gap:7px;
    font-size:13px;color:rgba(255,255,255,.6);font-weight:500;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.55;transform:translateX(0);}50%{opacity:1;transform:translateX(3px);}}

  .choices{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .choice{
    text-align:left;width:100%;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16);
    color:#fff;font-family:inherit;
    padding:15px 16px;border-radius:14px;
    font-size:16px;font-weight:500;line-height:1.4;
    transition:transform .15s, background .2s, border-color .2s;
  }
  .choice:active{transform:scale(.985);}
  .choice.correct{background:rgba(29,158,117,.22);border-color:var(--sr-teal-light);}
  .choice.wrong{background:rgba(163,45,45,.22);border-color:#E24B4A;}
  .choice:disabled{opacity:.5;}

  .feedback{
    margin-top:16px;padding:14px 16px;border-radius:12px;
    font-size:15px;line-height:1.55;font-weight:400;
    border-left:3px solid var(--sr-teal-light);
    background:rgba(29,158,117,.12);
    display:none;
  }
  .feedback.show{display:block;animation:rise .4s ease;}
  .feedback.bad{border-left-color:#E24B4A;background:rgba(163,45,45,.14);}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .cta{
    margin-top:18px;width:100%;
    background:#fff;color:var(--ink);
    border:none;font-family:inherit;
    padding:16px;border-radius:14px;
    font-size:16px;font-weight:600;
    display:none;align-items:center;justify-content:center;gap:8px;
    transition:transform .15s;
  }
  .cta.show{display:flex;}
  .cta:active{transform:scale(.985);}

  .holdwrap{display:flex;flex-direction:column;align-items:center;margin-top:20px;}
  .holdbtn{
    position:relative;width:128px;height:128px;border-radius:50%;
    border:none;background:transparent;cursor:pointer;font-family:inherit;
    touch-action:none;
  }
  .holdbtn svg{position:absolute;inset:0;transform:rotate(-90deg);}
  .holdbtn .track{fill:none;stroke:rgba(255,255,255,.16);stroke-width:7;}
  .holdbtn .prog{fill:none;stroke:var(--sr-teal-light);stroke-width:7;stroke-linecap:round;
    stroke-dasharray:364;stroke-dashoffset:364;transition:stroke-dashoffset .08s linear;}
  .holdbtn .face{
    position:absolute;inset:14px;border-radius:50%;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  }
  .holdbtn .face .ic{font-size:30px;line-height:1;}
  .holdbtn .face .t{font-size:12px;font-weight:600;color:rgba(255,255,255,.8);}
  .holdbtn.active .face{background:rgba(29,158,117,.2);border-color:var(--sr-teal-light);}
  .hold-label{margin-top:14px;font-size:14px;color:rgba(255,255,255,.7);font-weight:500;min-height:20px;text-align:center;}

  .swipewrap{margin-top:18px;position:relative;height:188px;}
  .swipecard{
    position:absolute;inset:0;border-radius:18px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
    padding:18px;display:flex;flex-direction:column;justify-content:space-between;
    touch-action:none;transition:transform .25s ease, opacity .25s ease;
  }
  .swipecard .q{font-size:17px;font-weight:500;line-height:1.45;}
  .swipelabels{display:flex;justify-content:space-between;font-size:13px;font-weight:600;}
  .swipelabels .no{color:#E24B4A;}
  .swipelabels .yes{color:var(--sr-teal-light);}
  .swipehint{text-align:center;font-size:13px;color:rgba(255,255,255,.5);margin-top:12px;font-weight:500;}

  .cover-badge{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
    padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;
    letter-spacing:.04em;margin-bottom:16px;
  }
  .arrow{font-size:18px;}
</style>
</head>
<body>
<div id="phone"></div>

<script>
const vibe = (p)=>{ if(navigator.vibrate){ navigator.vibrate(p); } };

const moments = [
  {
    id:'cover', scene:'scene-dawn', label:'Maple Wing', time:'6:58', wing:'Sunrise Ridge',
    render:(m)=>`
      <div class="cover-badge"><span class="dot" style="width:7px;height:7px;border-radius:50%;background:var(--sr-teal-light)"></span> Module 2 · Safe handling</div>
      <div class="line big">A day back on the floor.</div>
      <div class="sub">Priya returns from her injury leave today. You are on shift with her. Every transfer is a choice. Live the morning with her, one moment at a time.</div>
      <button class="cta show" onclick="next()">Start the shift <span class="arrow">→</span></button>`
  },
  {
    id:'decision', scene:'scene-room', label:'Staff room', time:'7:04', wing:'Maple Wing',
    render:(m)=>`
      <div class="eyebrow">First call of the day</div>
      <div class="speaker">Linda, supervisor</div>
      <div class="line">"Four residents on your list before breakfast. Where do you start?"</div>
      <div class="choices">
        <button class="choice" onclick="decide(this,false,'Jumping straight in skips the one thing that changed overnight. Mobility status shifts fast in residential care.')">Start with the easiest resident to build momentum</button>
        <button class="choice" onclick="decide(this,true,'Right. The plan tells you the equipment, the current status, and anything new since your last shift. It protects you both.')">Review each mobility plan before you touch anyone</button>
      </div>
      <div class="feedback" id="fb-decision"></div>
      <button class="cta" id="cta-decision" onclick="next()">Continue <span class="arrow">→</span></button>`
  },
  {
    id:'hold', scene:'scene-bedside', label:'Room 6 · Mr Tran', time:'7:18', wing:'Maple Wing',
    render:(m)=>`
      <div class="eyebrow">Sit to stand transfer</div>
      <div class="line">Mr Tran is at the edge of the bed. The plan calls for a slow, supported lift.</div>
      <div class="sub">Press and hold to support him. Stay steady. Do not rush it.</div>
      <div class="holdwrap">
        <button class="holdbtn" id="holdbtn">
          <svg viewBox="0 0 128 128"><circle class="track" cx="64" cy="64" r="58"/><circle class="prog" id="holdprog" cx="64" cy="64" r="58"/></svg>
          <span class="face"><span class="ic">↑</span><span class="t">hold</span></span>
        </button>
        <div class="hold-label" id="hold-label">Press and hold</div>
      </div>
      <div class="feedback" id="fb-hold"></div>
      <button class="cta" id="cta-hold" onclick="next()">He is steady. Continue <span class="arrow">→</span></button>`
  },
  {
    id:'swipe', scene:'scene-hall', label:'Maple Wing hall', time:'7:31', wing:'with Priya',
    render:(m)=>`
      <div class="eyebrow">Quick read</div>
      <div class="line">You and Priya reach the next room for a two person reposition.</div>
      <div class="swipewrap">
        <div class="swipecard" id="swipecard">
          <div class="swipelabels"><span class="no">◀ not yet</span><span class="yes">go ▶</span></div>
          <div class="q">Priya says "ready when you are." Do you begin?</div>
          <div></div>
        </div>
      </div>
      <div class="swipehint" id="swipehint">Swipe the card left or right</div>
      <div class="feedback" id="fb-swipe"></div>
      <button class="cta" id="cta-swipe" onclick="next()">Continue <span class="arrow">→</span></button>`
  },
  {
    id:'close', scene:'scene-close', label:'End of round', time:'7:46', wing:'Maple Wing',
    render:(m)=>`
      <div class="eyebrow">What the morning was about</div>
      <div class="line big">Two minutes. Every time.</div>
      <div class="sub">Priya's injury did not happen because she did not know the rules. It happened because one shift made it easy to skip one step. The step that mattered. You did not skip it today.</div>
      <button class="cta show" onclick="restart()">Replay the morning ↺</button>`
  }
];

let idx = 0;
const phone = document.getElementById('phone');

function buildDots(active){
  let s='';
  for(let i=0;i<moments.length;i++){ s+=`<i class="${i<=active?'on':''}"></i>`; }
  return s;
}

function showMoment(i){
  const m = moments[i];
  const el = document.createElement('div');
  el.className='moment';
  el.innerHTML = `
    <div class="scene ${m.scene}" data-label="${m.label}"></div>
    <div class="topbar">
      <span class="clock"><span class="dot"></span>${m.time}</span>
      <span class="wing">${m.wing}</span>
      <span class="dots">${buildDots(i)}</span>
    </div>
    <div class="spacer"></div>
    <div class="panel">${m.render(m)}</div>`;
  phone.appendChild(el);
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>el.classList.add('active')); });

  if(m.id==='cover' || m.id==='decision'){
    el.querySelector('.spacer').addEventListener('click', ()=>{});
  }
  if(m.id==='hold') wireHold(el);
  if(m.id==='swipe') wireSwipe(el);

  const old = phone.querySelectorAll('.moment');
  if(old.length>1){
    const prev = old[old.length-2];
    prev.classList.remove('active');
    setTimeout(()=>prev.remove(), 520);
  }
}

function next(){ if(idx<moments.length-1){ idx++; vibe(8); showMoment(idx); } }
function restart(){ idx=0; phone.innerHTML=''; showMoment(0); }

function decide(btn,correct,msg){
  const panel = btn.closest('.panel');
  panel.querySelectorAll('.choice').forEach(c=>c.disabled=true);
  const fb = panel.querySelector('#fb-decision');
  const cta = panel.querySelector('#cta-decision');
  if(correct){
    btn.classList.add('correct');
    fb.className='feedback show'; fb.textContent=msg;
    cta.classList.add('show'); vibe([10,40,12]);
  }else{
    btn.classList.add('wrong');
    fb.className='feedback show bad'; fb.textContent=msg + ' Try the call again.';
    const scene = btn.closest('.moment').querySelector('.scene');
    scene.classList.add('tint-bad');
    vibe([30,30,30]);
    setTimeout(()=>{
      panel.querySelectorAll('.choice').forEach(c=>{c.disabled=false;c.classList.remove('wrong');});
      fb.classList.remove('show'); scene.classList.remove('tint-bad');
    },2100);
  }
}

let holdRAF=null, holdStart=0, holdDone=false;
const HOLD_MS=2400, CIRC=364;
function wireHold(el){
  const btn = el.querySelector('#holdbtn');
  const prog = el.querySelector('#holdprog');
  const label = el.querySelector('#hold-label');
  const fb = el.querySelector('#fb-hold');
  const cta = el.querySelector('#cta-hold');

  const start=(e)=>{
    e.preventDefault(); if(holdDone) return;
    btn.classList.add('active'); holdStart=performance.now(); label.textContent='Hold steady…';
    vibe(6);
    const tick=(t)=>{
      const p=Math.min((t-holdStart)/HOLD_MS,1);
      prog.style.strokeDashoffset = CIRC*(1-p);
      if(p>=1){ succeed(); return; }
      holdRAF=requestAnimationFrame(tick);
    };
    holdRAF=requestAnimationFrame(tick);
  };
  const end=()=>{
    if(holdDone) return;
    cancelAnimationFrame(holdRAF); btn.classList.remove('active');
    const p=(performance.now()-holdStart)/HOLD_MS;
    if(p<1 && holdStart){
      prog.style.strokeDashoffset=CIRC;
      label.textContent='Too quick. Start again, slowly.';
      fb.className='feedback show bad';
      fb.textContent='Releasing early jerks the resident and loads your back. A safe lift is slow and continuous.';
      vibe([40,20,40]);
      setTimeout(()=>{ fb.classList.remove('show'); label.textContent='Press and hold'; },1900);
    }
  };
  const succeed=()=>{
    holdDone=true; btn.classList.add('active'); label.textContent='Steady. Well held.';
    fb.className='feedback show'; fb.textContent='That is what a safe lift feels like. Controlled, supported, no rush.';
    cta.classList.add('show'); vibe([12,30,12,30,18]);
  };

  btn.addEventListener('pointerdown',start);
  btn.addEventListener('pointerup',end);
  btn.addEventListener('pointerleave',end);
  btn.addEventListener('pointercancel',end);
}

function wireSwipe(el){
  const card=el.querySelector('#swipecard');
  const hint=el.querySelector('#swipehint');
  const fb=el.querySelector('#fb-swipe');
  const cta=el.querySelector('#cta-swipe');
  let sx=0,dx=0,drag=false,done=false;

  const down=(e)=>{ if(done)return; drag=true; sx=e.clientX; card.style.transition='none'; };
  const move=(e)=>{ if(!drag)return; dx=e.clientX-sx; card.style.transform=`translateX(${dx}px) rotate(${dx*0.04}deg)`; };
  const up=()=>{
    if(!drag)return; drag=false; card.style.transition='transform .3s ease, opacity .3s ease';
    if(Math.abs(dx)>92){
      done=true;
      const right=dx>0;
      card.style.transform=`translateX(${right?500:-500}px) rotate(${right?20:-20}deg)`;
      card.style.opacity='0'; hint.style.display='none';
      if(right){
        fb.className='feedback show bad';
        fb.textContent='Beginning before you agree roles, a count and positioning means one of you moves first. Confirm the plan, then go.';
        vibe([30,30,30]);
      }else{
        fb.className='feedback show';
        fb.textContent='Right. A two person task starts with a shared count and clear roles. Seconds of planning prevent an uneven, jerky move.';
        vibe([12,30,12]);
      }
      cta.classList.add('show');
    }else{
      card.style.transform='translateX(0) rotate(0)';
    }
    dx=0;
  };
  card.addEventListener('pointerdown',down);
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
}

showMoment(0);
</script>
</body>
</html>
